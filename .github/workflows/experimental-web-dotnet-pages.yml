name: Deploy Experimental Godot .NET Web Export

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/experimental-web-dotnet-pages.yml"
      - "SmwGodotNative.csproj"
      - "export_presets.cfg"
      - "src/**"
      - "tools/**"
      - "web/**"
  workflow_dispatch:
    inputs:
      godot_release_repo:
        description: "Repository containing the experimental Godot release assets"
        required: false
        default: "sabino/godot"
        type: string
      godot_release_tag:
        description: "Release tag to use. Leave blank to use the newest release."
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GODOT_RELEASE_REPO: ${{ inputs.godot_release_repo || 'sabino/godot' }}
  GODOT_RELEASE_TAG: ${{ inputs.godot_release_tag }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install WebAssembly workload
        run: |
          dotnet workload install wasm-tools
          dotnet workload install wasm-tools-net9 --skip-manifest-update

      - name: Download experimental Godot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/godot-release
          release_tag="$GODOT_RELEASE_TAG"
          if [[ -z "$release_tag" ]]; then
            release_tag="$(gh release list --repo "$GODOT_RELEASE_REPO" --limit 1 --json tagName,isDraft --jq 'map(select(.isDraft | not))[0].tagName')"
          fi
          [[ -n "$release_tag" && "$release_tag" != "null" ]] || { echo "Could not resolve a release tag for $GODOT_RELEASE_REPO" >&2; exit 1; }

          gh release download "$release_tag" \
            --repo "$GODOT_RELEASE_REPO" \
            --dir .cache/godot-release \
            --pattern "godot-web-dotnet-linux-x86_64.tar.gz" \
            --pattern "godot-web-dotnet-template-release-nothreads.zip" \
            --clobber

          tar -xzf .cache/godot-release/godot-web-dotnet-linux-x86_64.tar.gz -C .cache/godot-release
          GODOT_BIN="$(find .cache/godot-release/godot-web-dotnet-linux-x86_64 -type f -name 'godot.linuxbsd.editor.x86_64.mono' -perm -111 | head -n 1)"
          [[ -n "$GODOT_BIN" && -x "$GODOT_BIN" ]] || { echo "Could not find executable Godot binary" >&2; exit 1; }
          echo "GODOT_WEB_DOTNET_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          echo "GODOT_WEB_DOTNET_NUGET_SOURCE=$PWD/.cache/godot-release/godot-web-dotnet-linux-x86_64/GodotSharp/Tools/nupkgs" >> "$GITHUB_ENV"
          echo "GODOT_WEB_DOTNET_RELEASE_TEMPLATE=$PWD/.cache/godot-release/godot-web-dotnet-template-release-nothreads.zip" >> "$GITHUB_ENV"
          echo "Using Godot release $GODOT_RELEASE_REPO@$release_tag"

      - name: Export Godot .NET Web prototype
        run: tools/export-web-dotnet-prototype.sh web-export/out

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p public/import public/experimental-godot
          cp -R web/. public/
          cp tools/smw_import.py public/import/smw_import.py
          cp -R web-export/out/. public/experimental-godot/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
